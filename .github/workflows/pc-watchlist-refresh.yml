name: PC Price Intelligence - Watchlist Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "7 7 * * *"

permissions:
  contents: write

concurrency:
  group: pc-price-watchlist
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh official and retailer watchlist
        run: python scripts/discover.py
      - name: Commit watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          if git diff --cached --quiet; then
            echo "No watchlist changes."
            exit 0
          fi
          git commit -m "data: refresh PC watchlist"
          git push
