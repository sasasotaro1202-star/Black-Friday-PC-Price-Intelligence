name: Discover PC Watchlist

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pc-watchlist-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Discover public product pages
        run: python scripts/discover.py
      - name: Commit watchlist when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          if git diff --cached --quiet; then
            echo "No watchlist changes."
            exit 0
          fi
          git commit -m "data: refresh PC watchlist"
          git push
