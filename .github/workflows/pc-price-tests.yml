name: PC Price Intelligence - Tests

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pc-price-intelligence-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run regression and fail-closed validation tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m py_compile scripts/*.py
          # Validate the all-in budget policy and tracked accessory schema without network access.
          python -m unittest discover -s tests -p "test_budget_policy.py" -v
          # Mirror the production normalization stage so committed observation
          # counters and current-price exposure are tested in their final form.
          python scripts/sanitize.py
          # Regenerate derived ranking artifacts with the current scoring schema
          # before healthcheck; otherwise stale committed JSON can fail a valid code change.
          python scripts/report.py
          python scripts/timing_analysis.py
          python scripts/scenario_analysis.py
          python scripts/healthcheck.py
          python scripts/validate.py
