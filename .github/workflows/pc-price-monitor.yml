name: PC Price Intelligence

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check whether regular monitoring should run
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          import os
          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          start=datetime(2026,11,14,tzinfo=JST)
          end=datetime(2026,12,4,23,59,59,tzinfo=JST)
          in_bf=start <= now <= end
          event=os.environ.get("GITHUB_EVENT_NAME","")
          # The cron runs every 5 minutes so the BF window can truly observe
          # fast-moving sale/stock changes. Outside BF, run only every 15 minutes.
          regular_due = now.minute % 15 == 0
          run_now = event != "schedule" or in_bf or regular_due
          skip = not run_now
          print(f"skip={str(skip).lower()}")
          print(f"now_jst={now.isoformat()}")
          print(f"in_bf={str(in_bf).lower()}")
          print(f"regular_due={str(regular_due).lower()}")
          PY

      - name: Refresh watchlist when empty or stale
        id: watchlist
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              with open("data/watchlist.json", encoding="utf-8") as f: d=json.load(f)
              urls=d.get("urls") or []
              ts=d.get("generated_at")
              age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds() if ts else 10**12
              stale=age >= 24*3600
          except Exception:
              urls=[]; stale=True
          print(f"needs_refresh={str((not urls) or stale).lower()}")
          PY

      - name: Refresh watchlist
        if: steps.gate.outputs.skip != 'true' && steps.watchlist.outputs.needs_refresh == 'true'
        run: python scripts/discover.py

      - name: Collect, recover, sanitize, score and publish
        if: steps.gate.outputs.skip != 'true'
        env:
          MONITOR_MAX_URLS: "80"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python scripts/monitor.py
            python scripts/recover.py
            python scripts/sanitize.py
            python scripts/report.py
            python scripts/timing_analysis.py
            python scripts/scenario_analysis.py
            python scripts/healthcheck.py
            python scripts/validate.py
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: update PC price intelligence"
            if git push origin HEAD:main; then
              git fetch --no-tags origin main
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                echo "Published and verified on attempt $attempt"
                exit 0
              fi
              echo "Push returned success but origin/main does not match HEAD."
            fi
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "Failed to publish after 3 attempts."
          exit 1
