name: PC Price Intelligence
run-name: PC Price Intelligence${{ inputs.watchdog_recovery == true && ' [watchdog-recovery]' || '' }}

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "tests/**"
      - "README.md"
      - ".github/copilot-instructions.md"
  workflow_dispatch:
    inputs:
      watchdog_recovery:
        description: "Internal one-time recovery attempt initiated by the watchdog"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "3-59/5 * * * *"
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer-v3
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check whether regular monitoring should run
        id: gate
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          import json, os
          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          config_status="ok"
          try:
              with open("config/targets.json", encoding="utf-8") as f:
                  cfg=json.load(f)
              start=datetime.fromisoformat(cfg["monitor_window_start"].replace("Z","+00:00")).astimezone(JST)
              end=datetime.fromisoformat(cfg["monitor_window_end"].replace("Z","+00:00")).astimezone(JST)
              in_watch_window=start <= now <= end
          except Exception as exc:
              # Missing or malformed calendar must never be presented as an
              # official sale date. Retain normal-cadence monitoring.
              config_status="error:"+type(exc).__name__
              in_watch_window=False
          event=os.environ.get("GITHUB_EVENT_NAME","")
          schedule_cron=os.environ.get("SCHEDULE_CRON","")
          # The configured dates only define a provisional broad watch window.
          # Retailer sale authorization is separately source-verified by Python.
          if event == "schedule":
              expected_cron = "3-59/5 * * * *" if in_watch_window else "7,22,37,52 * * * *"
              run_now = schedule_cron == expected_cron
          else:
              run_now = True
          skip = not run_now
          print(f"skip={str(skip).lower()}")
          print(f"now_jst={now.isoformat()}")
          print(f"in_watch_window={str(in_watch_window).lower()}")
          print(f"calendar_config_status={config_status}")
          print(f"schedule_cron={schedule_cron}")
          print(f"run_now={str(run_now).lower()}")
          PY

      # Non-selected cron ticks stop here to avoid using runner time on full tests.
      # Every actual collection remains guarded by syntax/contract and regression tests.
      - name: Production syntax and fail-closed smoke gate
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p "test_production_contract.py" -v

      - name: Full regression gate before every production collection
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Refresh watchlist when empty or stale
        id: watchlist
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              with open("data/watchlist.json", encoding="utf-8") as f: d=json.load(f)
              with open("config/candidate_catalog.json", encoding="utf-8") as f: catalog=json.load(f)
              urls=d.get("urls") or []
              ts=d.get("generated_at")
              watch_url_by_id={str(x.get("id")): x.get("url") for x in urls if isinstance(x, dict) and x.get("id")}
              catalog_items=[x for x in (catalog.get("candidates") or []) if isinstance(x, dict) and x.get("id") and x.get("url")]
              catalog_url_by_id={str(x.get("id")): x.get("url") for x in catalog_items}
              watch_ids=set(watch_url_by_id)
              catalog_ids=set(catalog_url_by_id)
              missing_catalog_ids=catalog_ids - watch_ids
              catalog_url_mismatch_ids={
                  cid for cid, url in catalog_url_by_id.items()
                  if cid in watch_url_by_id and watch_url_by_id[cid] != url
              }
              age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds() if ts else 10**12
              stale=age >= 24*3600
          except Exception:
              urls=[]; stale=True; missing_catalog_ids={"catalog_unreadable"}; catalog_url_mismatch_ids=set()
          needs_refresh=(not urls) or stale or bool(missing_catalog_ids) or bool(catalog_url_mismatch_ids)
          print(f"needs_refresh={str(needs_refresh).lower()}")
          print(f"missing_catalog_count={len(missing_catalog_ids)}")
          print(f"catalog_url_mismatch_count={len(catalog_url_mismatch_ids)}")
          PY

      - name: Collect, preserve, quality-check and publish evidence
        if: steps.gate.outputs.skip != 'true'
        env:
          MONITOR_MAX_URLS: "100"
          NEEDS_WATCHLIST_REFRESH: ${{ steps.watchlist.outputs.needs_refresh }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            # A concurrent data publish or code merge may advance main after the
            # first preflight. Validate the exact tree we are about to execute.
            python -m py_compile scripts/*.py
            python -m unittest discover -s tests -p "test_production_contract.py" -v
            python -m unittest discover -s tests -p "test_*.py" -v
            git diff --check
            if [ "${NEEDS_WATCHLIST_REFRESH:-false}" = "true" ]; then
              echo "Refreshing watchlist after syncing origin/main."
              python scripts/discover.py
            fi
            python scripts/monitor.py
            python scripts/peripheral_monitor.py
            python scripts/build_component_monitor.py
            python scripts/recover.py
            python scripts/sanitize.py
            python scripts/official_campaign_dates.py
            python scripts/historical_bf_analysis.py
            # Derived reports/scores below are internal indexes and quality diagnostics only.
            # The final user-facing ranking is produced in ChatGPT when the user asks,
            # using the freshest repository data plus independent live-source checks.
            python scripts/report.py
            # Build the current DIY plan before rendering build-level buy timing.
            python scripts/self_build_planner.py
            python scripts/timing_analysis.py
            python scripts/scenario_analysis.py
            python scripts/healthcheck.py
            python scripts/validate.py
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: update PC price intelligence"
            if git push origin HEAD:main; then
              git fetch --no-tags origin main
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                echo "Published and verified on attempt $attempt"
                exit 0
              fi
              echo "Push returned success but origin/main does not match HEAD."
            fi
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "Failed to publish after 3 attempts."
          exit 1
