name: PC Price Intelligence

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check watchlist freshness
        id: watchlist
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              with open("data/watchlist.json", encoding="utf-8") as f:
                  data=json.load(f)
              urls=data.get("urls") or []
              ts=data.get("generated_at")
              if ts:
                  age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds()
              else:
                  age=10**12
              stale=age >= 24*3600
          except Exception:
              urls=[]
              stale=True
          print(f"needs_refresh={str((not urls) or stale).lower()}")
          PY

      - name: Refresh watchlist when empty or stale
        if: steps.watchlist.outputs.needs_refresh == 'true'
        run: python scripts/discover.py

      - name: Collect public observations
        env:
          MONITOR_MAX_URLS: "80"
        run: python scripts/monitor.py

      - name: Build current report
        run: python scripts/report.py

      - name: Build timing analysis
        run: python scripts/timing_analysis.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update PC price intelligence"
          git pull --rebase origin main
          git push
