name: Buy-now timing regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile timing and ranking modules
        run: python -m py_compile scripts/timing_analysis.py scripts/intelligence.py scripts/report.py
      - name: Run buy-now decision regression tests
        run: python -m unittest discover -s tests -p 'test_buy_now_decision.py' -v
