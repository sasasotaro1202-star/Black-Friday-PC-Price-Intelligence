name: PC Price Intelligence - Black Friday Season Fast

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check exact Black Friday season window (JST)
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          start=datetime(2026,11,14,tzinfo=JST)
          end=datetime(2026,12,4,23,59,59,tzinfo=JST)
          print(f"in_window={str(start <= now <= end).lower()}")
          print(f"now_jst={now.isoformat()}")
          PY

      - name: Refresh watchlist when empty or stale
        id: watchlist
        if: steps.window.outputs.in_window == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              with open("data/watchlist.json", encoding="utf-8") as f: d=json.load(f)
              with open("config/candidate_catalog.json", encoding="utf-8") as f: catalog=json.load(f)
              urls=d.get("urls") or []
              ts=d.get("generated_at")
              watch_ids={str(x.get("id")) for x in urls if isinstance(x, dict) and x.get("id")}
              catalog_ids={str(x.get("id")) for x in (catalog.get("candidates") or []) if isinstance(x, dict) and x.get("id")}
              missing_catalog_ids=catalog_ids - watch_ids
              age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds() if ts else 10**12
              stale=age >= 24*3600
          except Exception:
              urls=[]; stale=True; missing_catalog_ids={"catalog_unreadable"}
          needs_refresh=(not urls) or stale or bool(missing_catalog_ids)
          print(f"needs_refresh={str(needs_refresh).lower()}")
          print(f"missing_catalog_count={len(missing_catalog_ids)}")
          PY

      - name: Collect, recover, sanitize, score and publish
        if: steps.window.outputs.in_window == 'true'
        env:
          MONITOR_MAX_URLS: "100"
          NEEDS_WATCHLIST_REFRESH: ${{ steps.watchlist.outputs.needs_refresh }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            if [ "${NEEDS_WATCHLIST_REFRESH:-false}" = "true" ]; then
              echo "Refreshing watchlist after syncing origin/main."
              python scripts/discover.py
            fi
            python scripts/monitor.py
            python scripts/peripheral_monitor.py
            python scripts/recover.py
            python scripts/sanitize.py
            python scripts/report.py
            python scripts/timing_analysis.py
            python scripts/scenario_analysis.py
            python scripts/healthcheck.py
            python scripts/validate.py
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: fast Black Friday season observation"
            if git push origin HEAD:main; then
              git fetch --no-tags origin main
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                echo "Published and verified on attempt $attempt"
                exit 0
              fi
              echo "Push returned success but origin/main does not match HEAD."
            fi
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "Failed to publish after 3 attempts."
          exit 1
