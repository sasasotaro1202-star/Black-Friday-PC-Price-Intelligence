name: PC Price Intelligence - Black Friday Season Fast

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 13-30 11 *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 1-4 12 *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check exact Black Friday season window (JST)
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          start=datetime(2026,11,14,tzinfo=JST)
          end=datetime(2026,12,4,23,59,59,tzinfo=JST)
          print(f"in_window={str(start <= now <= end).lower()}")
          print(f"now_jst={now.isoformat()}")
          PY
      - name: Refresh watchlist when empty or stale
        id: watchlist
        if: steps.window.outputs.in_window == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              with open("data/watchlist.json", encoding="utf-8") as f:
                  d=json.load(f)
              urls=d.get("urls") or []
              ts=d.get("generated_at")
              age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds() if ts else 10**12
              stale=age >= 24*3600
          except Exception:
              urls=[]; stale=True
          print(f"needs_refresh={str((not urls) or stale).lower()}")
          PY
      - name: Refresh watchlist
        if: steps.window.outputs.in_window == 'true' && steps.watchlist.outputs.needs_refresh == 'true'
        run: python scripts/discover.py
      - name: Collect, sanitize, score and publish
        if: steps.window.outputs.in_window == 'true'
        env:
          MONITOR_MAX_URLS: "30"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python scripts/monitor.py
            python scripts/sanitize.py
            python scripts/report.py
            python scripts/timing_analysis.py
            python scripts/scenario_analysis.py
            python scripts/validate.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: fast Black Friday season observation"
            if git push origin HEAD:main; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            git fetch --no-tags origin main
            git reset --hard origin/main
          done
          echo "Failed to publish after 3 attempts."
          exit 1
