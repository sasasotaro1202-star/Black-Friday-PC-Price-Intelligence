name: PC Price Intelligence - Black Friday Season Fast

on:
  workflow_dispatch:
  schedule:
    # Broad 2026 Black Friday-season watch window.
    # Exact 2026 retailer dates are not assumed until officially published.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 14-30 11 *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 1-4 12 *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-fast
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap watchlist when empty
        shell: bash
        run: |
          python - <<'PY'
          import json
          try:
              d=json.load(open("data/watchlist.json",encoding="utf-8"))
              empty=not bool(d.get("urls"))
          except Exception:
              empty=True
          if empty:
              import subprocess
              subprocess.check_call(["python","scripts/discover.py"])
          PY

      - name: Fast season monitoring
        env:
          MONITOR_MAX_URLS: "30"
        run: python scripts/monitor.py

      - name: Update 100-point decision report
        run: |
          python scripts/report.py
          python scripts/timing_analysis.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: fast Black Friday season observation"
          git push
