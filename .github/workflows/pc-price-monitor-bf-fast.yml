name: PC Price Intelligence - Black Friday Season Fast

on:
  workflow_dispatch:
  schedule:
    # Broad 2026 Black Friday-season watch window.
    # Exact 2026 retailer dates are not assumed until officially published.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 14-30 11 *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * 1-4 12 *"

permissions:
  contents: write

concurrency:
  group: pc-price-intelligence-writer
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refresh watchlist when empty or stale
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          JST=timezone(timedelta(hours=9))
          try:
              d=json.load(open("data/watchlist.json",encoding="utf-8"))
              urls=d.get("urls") or []
              ts=d.get("generated_at")
              age=(datetime.now(JST)-datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds() if ts else 10**12
              needs=(not urls) or age >= 24*3600
          except Exception:
              needs=True
          if needs:
              subprocess.check_call(["python","scripts/discover.py"])
          PY

      - name: Fast season monitoring
        env:
          MONITOR_MAX_URLS: "30"
        run: python scripts/monitor.py

      - name: Update 100-point decision report
        run: |
          python scripts/report.py
          python scripts/timing_analysis.py
          python scripts/scenario_analysis.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: fast Black Friday season observation"
          git push
